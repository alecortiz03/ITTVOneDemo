name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./ModernSignageUI

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ModernSignageUI/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Expo Web
        run: npx expo export --platform web

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli

      - name: Build Tauri Windows app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.msi
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.exe
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.sig
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: ITTVOne v0.1.1
          generate_release_notes: true
          files: |
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.exe
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.sig
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.msi
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.sig
            ModernSignageUI/src-tauri/target/release/bundle/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
