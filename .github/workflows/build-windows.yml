name: Build Windows App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./ModernSignageUI

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ModernSignageUI/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Expo Web
        run: npx expo export --platform web

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli

      - name: Build Tauri Windows app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater latest.json
        shell: pwsh
        run: |
          $version = "0.1.2"
          $exeName = "ITTVOne_${version}_x64-setup.exe"
          $sigPath = "src-tauri/target/release/bundle/nsis/$exeName.sig"
          $jsonPath = "src-tauri/target/release/bundle/latest.json"

          $signature = (Get-Content $sigPath -Raw).Trim()

          $manifest = @{
            version = $version
            notes = "ITTVOne update $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/alecortiz03/ITTVOneDemo/releases/latest/download/$exeName"
              }
            }
          } | ConvertTo-Json -Depth 5

          $manifest | Out-File $jsonPath -Encoding utf8
          Get-Content $jsonPath

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.msi
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.exe
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.sig
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.sig
            ModernSignageUI/src-tauri/target/release/bundle/latest.json
            ModernSignageUI/src-tauri/target/release/bundle/nsis/latest.json
            ModernSignageUI/src-tauri/target/release/bundle/msi/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.2
          name: ITTVOne v0.1.2
          generate_release_notes: true
          files: |
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.exe
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.sig
            ModernSignageUI/src-tauri/target/release/bundle/nsis/latest.json
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.msi
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.sig
            ModernSignageUI/src-tauri/target/release/bundle/msi/latest.json
            ModernSignageUI/src-tauri/target/release/bundle/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
