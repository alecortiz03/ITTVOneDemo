name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./ModernSignageUI

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ModernSignageUI/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Expo Web
        run: npx expo export --platform web

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli

      - name: Build Tauri Windows app
        run: npx tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            ModernSignageUI/src-tauri/target/release/bundle/msi/*.msi
            ModernSignageUI/src-tauri/target/release/bundle/nsis/*.exe
